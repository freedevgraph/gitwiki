{% extends "base.html" %}
{% block title %}Diff: {{ commit_hash[:8] }} - {{ settings.site_name }}{% endblock %}
{% block content %}
<div class="diff-page">
    <h1>Diff for {{ name }} ({{ commit_hash[:8] }})</h1>

    <div class="page-actions">
        <a href="/{{ name }}/history" class="btn">Back to History</a>
    </div>

    <div class="diff-content">
        {% if diff %}
            <pre>{{ diff }}</pre>
        {% else %}
            <p>No diff available for this commit.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
